<!-- Netlify Forms detection file. Netlify's build-time parser only scans static
     HTML, so this hidden copy guarantees the form registers even if the page
     that renders it ever moves to JS rendering. Keep field names in sync with
     the form in src/pages/index.astro. Not linked from anywhere. -->
<form name="overberg-trading-signup" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="overberg-trading-signup" />
  <input name="bot-field" />
  <input name="name" type="text" />
  <input name="whatsapp" type="tel" />
  <input name="town" type="text" />
  <input name="consent" type="checkbox" value="yes" />
</form>
