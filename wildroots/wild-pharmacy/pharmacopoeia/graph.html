<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wild Pharmacy — the Pharmacopoeia (3D)</title>
<style>
  :root{ --ink:#0c0a07; --cream:#e9dcc4; --gold:#f4c95d; --green:#6ee84e; --teal:#5fe3d0; --mag:#ff6fb0; --mute:#9a8f7e; --edge:#3a2c20;
    --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--cream);font-family:var(--mono);overflow:hidden}
  #bg{position:fixed;inset:0;z-index:0;background:#0c0a07 center/cover no-repeat;}
  #bg.img{background-image:linear-gradient(rgba(8,6,4,.55),rgba(8,6,4,.72)),url("garden-bg.jpg");}
  #bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(8,5,3,.6) 100%);}
  #graph{position:fixed;inset:0;z-index:1;transition:bottom .25s ease}
  #hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;
    padding:14px 18px;gap:14px;pointer-events:none;background:linear-gradient(to bottom,rgba(8,5,3,.74),transparent)}
  .ttl{font-size:13px;letter-spacing:.14em;color:var(--green)} .ttl b{color:var(--gold);font-weight:500}
  .sub{font-size:11px;color:var(--mute);margin-top:3px}
  #search{pointer-events:auto;margin-top:8px;position:relative;width:300px;max-width:64vw}
  #search input{width:100%;font-family:var(--mono);font-size:12px;color:var(--cream);background:rgba(20,14,10,.9);border:1px solid var(--edge);border-radius:8px;padding:7px 11px}
  #search input:focus{outline:none;border-color:var(--green)}
  #results{position:absolute;top:36px;left:0;right:0;z-index:8;background:rgba(12,8,5,.97);border:1px solid var(--edge);border-radius:10px;padding:6px;display:none;max-height:54vh;overflow:auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #results.on{display:block}
  #results .lbl{font-size:9.5px;letter-spacing:.14em;color:#6f6450;text-transform:uppercase;margin:5px 5px 5px}
  #results .r{font-size:12px;color:var(--cream);padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
  #results .r:hover{background:rgba(40,28,16,.7)}
  #results .r i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
  #results .r .lt{color:var(--mute);font-style:italic;font-size:10px;margin-left:auto}
  #results .chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 6px}
  #results .chip{font-size:11.5px;border-radius:16px;padding:5px 11px;cursor:pointer;background:rgba(255,255,255,.04)}
  #panel{pointer-events:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:11px;color:var(--mute)}
  #panel select,#panel .btn{font-family:var(--mono);font-size:11px;color:var(--cream);background:rgba(20,14,10,.88);border:1px solid var(--edge);border-radius:7px;padding:5px 9px}
  #panel .btn{color:var(--teal);cursor:pointer} #panel .btn:hover{border-color:var(--teal);color:var(--cream)}
  #legend{position:fixed;left:18px;bottom:16px;z-index:5;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:62vw;
    font-size:10.5px;color:var(--mute);background:rgba(8,5,3,.5);padding:9px 12px;border-radius:10px}
  #legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;transition:opacity .15s}
  #legend span.off{opacity:.26;text-decoration:line-through}
  #legend i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 6px currentColor}
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;font-size:10.5px;color:#7a6a4e;pointer-events:none;text-align:center}
  #info{position:fixed;right:18px;bottom:16px;z-index:6;max-width:320px;max-height:62vh;overflow:auto;font-size:11.5px;line-height:1.5;
    background:rgba(12,8,5,.88);border:1px solid var(--edge);border-radius:11px;padding:12px 14px;display:none;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #info.on{display:block}
  #info h3{font-size:14px;color:var(--gold);font-weight:500;margin-bottom:3px}
  #info .lat{font-size:10.5px;color:var(--mute);font-style:italic;margin-bottom:7px}
  #info .row{margin:4px 0} #info .k{font-weight:500}
  #info .close{display:none}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9;background:rgba(20,14,10,.96);border:1px solid var(--gold);
    color:var(--cream);font-size:11.5px;padding:7px 14px;border-radius:9px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1}
  #pic{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:6;width:210px;display:none;pointer-events:none;
    border:1px solid rgba(110,232,78,.28);border-radius:13px;padding:7px;background:rgba(12,9,5,.82);
    box-shadow:0 8px 34px rgba(0,0,0,.5),0 0 22px rgba(110,232,78,.07);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
  #pic.on{display:block;animation:picIn .38s cubic-bezier(.2,.9,.25,1)}
  #pic img{width:100%;display:block;border-radius:9px}
  #pic .cap{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8fa07a;text-align:center;margin-top:6px}
  #pic .zoom{display:none;position:absolute;right:4px;bottom:4px;width:17px;height:17px;border-radius:5px;background:rgba(6,4,2,.82);color:#cbe8b0;font-size:11px;align-items:center;justify-content:center;pointer-events:none}
  @keyframes picIn{from{opacity:0;transform:translateY(-50%) scale(.93)}to{opacity:1;transform:translateY(-50%) scale(1)}}
  @keyframes picExp{from{opacity:0}to{opacity:1}}
  #gate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(6,4,2,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #gate.on{display:flex;animation:picExp .22s ease}
  #gate .card{position:relative;max-width:400px;width:100%;background:rgba(16,12,8,.98);border:1px solid rgba(110,232,78,.3);
    border-radius:16px;padding:26px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #gate .gx{position:absolute;top:11px;right:15px;color:#8a7c62;font-size:22px;line-height:1;cursor:pointer}
  #gate .gx:hover{color:var(--cream)}
  #gate h2{font-size:16px;color:var(--gold);font-weight:500;margin-bottom:9px;letter-spacing:.01em}
  #gate p{font-size:12.5px;color:#b7ab95;line-height:1.6;margin-bottom:15px}
  #gate .field{width:100%;font-family:var(--mono);font-size:13px;color:var(--cream);background:rgba(8,5,3,.9);
    border:1px solid var(--edge);border-radius:9px;padding:10px 12px;margin-bottom:9px}
  #gate .field:focus{outline:none;border-color:var(--green)}
  #gate .go{width:100%;font-family:var(--mono);font-size:13px;font-weight:500;color:#0c0a07;background:var(--green);
    border:none;border-radius:9px;padding:11px;cursor:pointer;letter-spacing:.03em}
  #gate .go:hover{filter:brightness(1.08)} #gate .go[disabled]{opacity:.6;cursor:default}
  #gate a.go{display:block;text-align:center;text-decoration:none;margin-bottom:2px;color:#0c0a07;background:var(--gold)}
  #gate .tiny{font-size:10.5px;color:#7a6e57;text-align:center;margin-top:13px;cursor:pointer}
  #gate .tiny:hover{color:#b7ab95}
  #gate .div{display:flex;align-items:center;gap:9px;margin:16px 0 12px;color:#6f6450;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
  #gate .div::before,#gate .div::after{content:"";flex:1;height:1px;background:var(--edge)}
  #gate .err{font-size:11px;color:#ff8a8a;margin:-2px 0 9px;min-height:13px}
  @media (max-width:640px){
    #hud{padding:10px 12px} .ttl{font-size:12px} .sub{font-size:10px}
    #search{width:100%;max-width:none} #search input{font-size:13px}
    #panel select,#panel .btn{padding:5px 8px}
    #legend{left:8px;right:8px;bottom:8px;max-width:none;gap:7px 9px;font-size:11px;justify-content:center;max-height:78px;overflow:auto}
    #legend span{padding:2px 1px} #legend i{width:11px;height:11px}
    #hint{display:none} .scene-nav-info{display:none!important}
    #info{left:8px;right:8px;bottom:98px;max-width:none;max-height:40vh;font-size:12px}
    #info .close{display:block;position:absolute;top:7px;right:11px;color:var(--gold);font-size:20px;line-height:1;cursor:pointer}
    body.boxopen #graph{bottom:calc(40vh + 104px)}
    #pic{left:auto;right:12px;top:auto;bottom:calc(40vh + 112px);transform:none;width:60px;padding:3px;border-radius:10px;border-color:rgba(110,232,78,.42);pointer-events:auto;cursor:pointer}
    #pic.on{animation:none}
    #pic .cap{display:none} #pic .zoom{display:flex}
    #pic.expanded{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:80vw;max-width:330px;padding:6px;z-index:13;box-shadow:0 0 0 100vmax rgba(6,4,2,.74),0 12px 40px #000;animation:picExp .26s ease}
    #pic.expanded .cap{display:block;font-size:10px} #pic.expanded .zoom{display:none}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

:parsley","target":"effect:urinary","type":"effect"},{"source":"plant:parsley","target":"effect:anti-inflammatory","type":"effect"},{"source":"plant:parsley","target":"ailment:indigestion","type":"ailment"},{"source":"plant:parsley","target":"ailment:bloating","type":"ailment"},{"source":"plant:parsley","target":"ailment:halitosis","type":"ailment"},{"source":"plant:parsley","target":"ailment:edema","type":"ailment"},{"source":"plant:parsley","target":"part:leaf","type":"part"},{"source":"plant:parsley","target":"part:root","type":"part"},{"source":"plant:parsley","target":"part:seed","type":"part"},{"source":"plant:parsley","target":"prep:infusion","type":"prep"},{"source":"plant:parsley","target":"prep:dried","type":"prep"},{"source":"plant:parsley","target":"prep:fresh-juice","type":"prep"},{"source":"plant:parsley","target":"region:mediterranean","type":"region"},{"source":"plant:parsley","target":"region:temperate","type":"region"},{"source":"plant:parsley","target":"region:sun","type":"region"},{"source":"plant:parsley","target":"region:easy-garden","type":"region"},{"source":"plant:parsley","target":"region:container","type":"region"},{"source":"plant:parsley","target":"use:culinary","type":"use"},{"source":"plant:parsley","target":"use:nutritive","type":"use"},{"source":"plant:parsley","target":"use:aromatic","type":"use"},{"source":"plant:parsley","target":"use:companion-plant","type":"use"},{"source":"plant:parsley","target":"caution:avoid-in-pregnancy","type":"caution"},{"source":"plant:parsley","target":"caution:avoid-breastfeeding","type":"caution"},{"source":"plant:parsley","target":"caution:drug-interactions","type":"caution"},{"source":"plant:parsley","target":"caution:phototoxic","type":"caution"},{"source":"plant:parsley","target":"constituent:apiole","type":"constituent"},{"source":"plant:parsley","target":"constituent:myristicin","type":"constituent"},{"source":"plant:parsley","target":"constituent:apigenin","type":"constituent"},{"source":"plant:parsley","target":"constituent:vitamin-c","type":"constituent"},{"source":"plant:parsley","target":"constituent:vitamin-k","type":"constituent"},{"source":"plant:parsley","target":"constituent:essential-oil","type":"constituent"},{"source":"plant:parsley","target":"constituent:furanocoumarins","type":"constituent"},{"source":"plant:parsley","target":"family:apiaceae","type":"family"},{"source":"plant:parsley","target":"origin:mediterranean-(central/eastern)","type":"origin"},{"source":"plant:caper","target":"effect:anti-inflammatory","type":"effect"},{"source":"plant:caper","target":"effect:digestive","type":"effect"},{"source":"plant:caper","target":"effect:antimicrobial","type":"effect"},{"source":"plant:caper","target":"ailment:indigestion","type":"ailment"},{"source":"plant:caper","target":"ailment:inflammation","type":"ailment"},{"source":"plant:caper","target":"ailment:joint-pain","type":"ailment"},{"source":"plant:caper","target":"part:flower","type":"part"},{"source":"plant:caper","target":"part:fruit","type":"part"},{"source":"plant:caper","target":"part:root","type":"part"},{"source":"plant:caper","target":"part:bark","type":"part"},{"source":"plant:caper","target":"prep:ferment","type":"prep"},{"source":"plant:caper","target":"prep:dried","type":"prep"},{"source":"plant:caper","target":"prep:decoction","type":"prep"},{"source":"plant:caper","target":"prep:infusion","type":"prep"},{"source":"plant:caper","target":"region:mediterranean","type":"region"},{"source":"plant:caper","target":"region:arid","type":"region"},{"source":"plant:caper","target":"region:sun","type":"region"},{"source":"plant:caper","target":"region:drought-hardy","type":"region"},{"source":"plant:caper","target":"use:culinary","type":"use"},{"source":"plant:caper","target":"use:aromatic","type":"use"},{"source":"plant:caper","target":"use:ornamental","type":"use"},{"source":"plant:caper","target":"caution:allergen","type":"caution"},{"source":"plant:caper","target":"caution:hypertension-caution","type":"caution"},{"source":"plant:caper","target":"constituent:rutin","type":"constituent"},{"source":"plant:caper","target":"constituent:quercetin","type":"constituent"},{"source":"plant:caper","target":"constituent:kaempferol","type":"constituent"},{"source":"plant:caper","target":"constituent:glucosinolates","type":"constituent"},{"source":"plant:caper","target":"constituent:flavonoids","type":"constituent"},{"source":"plant:caper","target":"family:capparaceae","type":"family"},{"source":"plant:caper","target":"origin:mediterranean","type":"origin"}]};</script>
<script>
  const COLORS = { plant:"#f4c95d", effect:"#6ee84e", ailment:"#ff6fb0", part:"#5fe3d0", prep:"#ff9d45",
    region:"#6aa84f", use:"#b07fd8", caution:"#ff5a5a", constituent:"#5aa0ff", family:"#caa15a", origin:"#d9c089" };
  const LABELS = { plant:"plant", effect:"effect", ailment:"ailment", part:"part", prep:"preparation",
    region:"grows-in", use:"other-use", caution:"caution", constituent:"constituent", family:"family", origin:"origin" };
  const data = window.__GRAPH__;
  const byId = new Map(data.nodes.map(n => [n.id, n]));
  const isMobile = matchMedia("(pointer:coarse)").matches || innerWidth < 700;
  function end(x) { return typeof x === "object" ? x : byId.get(x); }

  (function(){ const im=new Image(); im.onload=()=>{ document.getElementById("bg").classList.add("img"); window.__BGIMG__=im; }; im.src="garden-bg.jpg"; })();

  let toastT; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2300); }

  const active = new Set(Object.keys(LABELS));
  const leg = document.getElementById("legend");
  Object.entries(LABELS).forEach(([t, l]) => {
    const s = document.createElement("span"); s.dataset.t = t;
    s.innerHTML = '<i style="background:' + COLORS[t] + ';color:' + COLORS[t] + '"></i><span style="color:#9a8f7e">' + l + '</span>';
    s.onclick = () => { active.has(t) ? active.delete(t) : active.add(t); s.classList.toggle("off", !active.has(t)); refreshVis(); };
    leg.appendChild(s);
  });
  let lens = "all";
  const hl = { nodes: new Set(), links: new Set() };
  let selected = null;

  const GTEX = (function () {
    const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.22, "rgba(255,255,255,0.5)"); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  })();
  const glowOf = new Map();
  function baseGlow(n) { return n.type === "plant" ? 0.75 : 0.5; }
  function makeGlow(n) {
    const m = new THREE.SpriteMaterial({ map: GTEX, color: COLORS[n.type] || "#888", blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: baseGlow(n) });
    const s = new THREE.Sprite(m); const sz = n.type === "plant" ? 13 : 5.5; s.scale.set(sz, sz, 1);
    glowOf.set(n.id, { s, n }); return s;
  }

  const elem = document.getElementById("graph");
  const Graph = ForceGraph3D({ rendererConfig: { alpha: true, antialias: true, preserveDrawingBuffer: true } })(elem)
    .backgroundColor("rgba(12,10,7,0)")
    .graphData(data).nodeId("id")
    .nodeLabel(n => `<div style="font-family:monospace;font-size:11px;color:#e9dcc4;background:rgba(8,5,3,.9);padding:3px 7px;border-radius:5px">${n.label}${n.type==='plant'&&n.latin?'<br><i style="color:#9a8f7e">'+n.latin+'</i>':' &middot; '+LABELS[n.type]}</div>`)
    .nodeColor(nodeColor)
    .nodeVal(n => (n.type === "plant" ? 3.4 : 1.1) * (hl.nodes.has(n) ? 1.7 : 1))
    .nodeOpacity(0.9)
    .nodeThreeObjectExtend(true).nodeThreeObject(makeGlow)
    .nodeVisibility(n => active.has(n.type))
    .linkVisibility(l => active.has(end(l.source).type) && active.has(end(l.target).type) && (lens === "all" || l.type === lens))
    .linkColor(linkColor)
    .linkWidth(l => hl.links.has(l) ? 1.8 : 0.3)
    .linkDirectionalParticles(l => hl.links.has(l) ? 4 : 0)
    .linkDirectionalParticleSpeed(0.012).linkDirectionalParticleWidth(1.8)
    .linkCurvature(0.16)
    .warmupTicks(60).cooldownTicks(isMobile ? 140 : 220)
    .onNodeClick(onNodeClick).onBackgroundClick(reset);
  Graph.d3Force("charge").strength(-32);
  try { Graph.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2)); } catch (_) {}

  const neigh = new Map(), inc = new Map();
  for (const l of data.links) {
    const s = end(l.source).id, t = end(l.target).id;
    (neigh.get(s) || neigh.set(s, new Set()).get(s)).add(t);
    (neigh.get(t) || neigh.set(t, new Set()).get(t)).add(s);
    (inc.get(s) || inc.set(s, []).get(s)).push(l);
    (inc.get(t) || inc.set(t, []).get(t)).push(l);
  }
  let _fitted = false;
  Graph.onEngineStop(() => { if (!_fitted) { _fitted = true; Graph.zoomToFit(700, isMobile ? 26 : 90); const h = decodeURIComponent((location.hash || "").slice(1)); if (h && byId.get(h)) setTimeout(() => onNodeClick(byId.get(h)), 750); } });

  document.getElementById("stat").textContent = data.nodes.length + " nodes · " + data.links.length + " links · " + data.nodes.filter(n => n.type === "plant").length + " plants";

  function nodeColor(n) { if (!selected) return COLORS[n.type] || "#888"; return hl.nodes.has(n) ? (COLORS[n.type] || "#888") : "rgba(74,64,52,0.12)"; }
  function linkColor(l) { if (hl.links.has(l)) return COLORS[l.type] || "#caa15a"; return selected ? "rgba(90,78,60,0.04)" : "rgba(150,130,100,0.13)"; }
  function updateGlows() { glowOf.forEach(({ s, n }) => { const b = baseGlow(n); s.material.opacity = !selected ? b : (hl.nodes.has(byId.get(n.id)) ? Math.min(1, b + 0.3) : 0.05); }); }
  function refreshHL() { Graph.nodeColor(Graph.nodeColor()).nodeVal(Graph.nodeVal()).linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).linkDirectionalParticles(Graph.linkDirectionalParticles()); updateGlows(); }
  function refreshVis() { Graph.nodeVisibility(Graph.nodeVisibility()).linkVisibility(Graph.linkVisibility()); }

  function setHash(id){ try{ history.replaceState(null,"","#"+encodeURIComponent(id)); }catch(_){} }
  function clearHash(){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(_){} }

  function focusCam(node) {
    const run = () => { const dist = node.type === "plant" ? 170 : 120, r = Math.hypot(node.x, node.y, node.z) || 1;
      Graph.cameraPosition({ x: node.x * (1 + dist / r), y: node.y * (1 + dist / r), z: node.z * (1 + dist / r) }, node, 800); };
    if (isMobile) { document.body.classList.add("boxopen"); requestAnimationFrame(() => { window.dispatchEvent(new Event("resize")); requestAnimationFrame(run); }); }
    else run();
  }
  function onNodeClick(node) {
    if (!node) return;
    if (selected === node) { reset(); return; }
    if (window.__METER__ && window.__METER__.guard(node)) return;
    selected = node;
    hl.nodes = new Set([node]);
    (neigh.get(node.id) || new Set()).forEach(id => { const m = byId.get(id); if (m) hl.nodes.add(m); });
    hl.links = new Set(inc.get(node.id) || []);
    refreshHL(); setHash(node.id); showInfo(node); showPic(node); focusCam(node);
  }
  function reset() {
    selected = null; hl.nodes.clear(); hl.links.clear(); refreshHL(); clearHash();
    document.getElementById("info").classList.remove("on");
    document.getElementById("pic").classList.remove("on", "expanded");
    if (document.body.classList.contains("boxopen")) { document.body.classList.remove("boxopen"); requestAnimationFrame(() => window.dispatchEvent(new Event("resize"))); }
  }

  const info = document.getElementById("info");
  const PICS = new Set(["african-wild-ginger","alfalfa","aloe-vera","amaranth","angelica-dong-quai","argan","ashwagandha","asparagus","bacopa","bamboo","baobab","basil","bilberry","black-seed","blue-lotus","borage","buchu","bulbine","burdock","cacao","calendula","cannabis","caper","cardamom","cats-claw","cayenne","celery","chaga","chickweed","christmas-berry","cinnamon","clove","coconut","coffee","cola-nut","comfrey","cordyceps","coriander","dandelion","dill","echinacea","elderberry","elecampane","eucalyptus","evening-primrose","eyebright","fennel","fenugreek","feverfew","garlic","german-chamomile","ginger","ginkgo","globe-artichoke","goldenrod","goldenseal","gotu-kola","guarana","guava","hawthorn","honeybush","hops","horsetail","hyssop","jasmine","kankerbossie-cancer-bush","king-of-bitters","lavender","lemon-balm","lemon-verbena","lemongrass","licorice","lime-linden-flower","lions-mane","lungwort","marshmallow","meadowsweet","milk-thistle","moringa","motherwort","mullein","nasturtium","neem","oats","opium-poppy","oregano","panax-ginseng","parsley","passion-flower","pelargonium","pepperbark","peppermint","pine","plantain-ribwort","pokeweed","raspberry-leaf","red-clover","reishi","rhodiola","rhubarb","roman-chamomile","rooibos","rosemary","sage","sceletium-kanna","schisandra","siberian-ginseng","skullcap","slippery-elm","st-johns-wort","stinging-nettle","tarragon","tea","thyme","tobacco","tulsi","turmeric","valerian","vervain","white-willow","wild-dagga","wild-olive","witch-hazel","wormwood","yarrow"]);
  const pic = document.getElementById("pic"), picImg = pic.querySelector("img"), picCap = pic.querySelector(".cap");
  pic.addEventListener("click", () => { if (isMobile) pic.classList.toggle("expanded"); });
  function showPic(n) {
    const key = (n && n.type === "plant") ? n.id.slice(6) : null;
    if (key && PICS.has(key)) { picImg.src = "pics/" + key + ".webp"; picCap.textContent = n.label; pic.classList.remove("expanded"); pic.classList.add("on"); }
    else { pic.classList.remove("on", "expanded"); }
  }
  function showInfo(n) {
    info.classList.add("on");
    const close = '<span class="close" onclick="window.PHARMA.reset()">&times;</span>';
    if (n.type === "plant") {
      const g = {};
      (inc.get(n.id) || []).forEach(l => { const o = end(l.source).id === n.id ? end(l.target) : end(l.source); (g[o.type] = g[o.type] || []).push(o.label); });
      info.innerHTML = close + '<h3>' + n.label + '</h3>' + (n.latin ? '<div class="lat">' + n.latin + '</div>' : '') +
        Object.keys(LABELS).filter(t => g[t]).map(t => '<div class="row"><span class="k" style="color:' + COLORS[t] + '">' + LABELS[t] + ':</span> ' + [...new Set(g[t])].join(", ") + '</div>').join('');
    } else {
      const plants = (inc.get(n.id) || []).map(l => end(l.source).id === n.id ? end(l.target) : end(l.source)).filter(x => x.type === "plant");
      info.innerHTML = close + '<h3 style="color:' + COLORS[n.type] + '">' + n.label + '</h3><div class="lat">' + LABELS[n.type] + ' · shared by ' + plants.length + ' plants</div>' +
        '<div class="row">' + plants.map(p => p.label).sort().join(" · ") + '</div>';
    }
  }
  document.getElementById("lens").addEventListener("change", e => { lens = e.target.value; refreshVis(); });

  // ---- search + quick-query chips ----
  const q = document.getElementById("q"), results = document.getElementById("results");
  const quick = data.nodes.filter(n => n.type === "ailment" || n.type === "effect")
    .map(n => ({ n, d: (inc.get(n.id) || []).length })).sort((a, b) => b.d - a.d).slice(0, 14).map(x => x.n);
  function renderChips() {
    results.innerHTML = '<div class="lbl">what can I take for…</div><div class="chips">' +
      quick.map(n => '<span class="chip" data-id="' + n.id + '" style="color:' + COLORS[n.type] + ';border:1px solid ' + COLORS[n.type] + '55">' + n.label + '</span>').join('') + '</div>';
    results.querySelectorAll(".chip").forEach(c => c.onclick = () => pick(byId.get(c.dataset.id)));
  }
  function renderResults(term) {
    const t = term.toLowerCase();
    const m = data.nodes.filter(n => n.label.toLowerCase().includes(t) || (n.latin && n.latin.toLowerCase().includes(t)));
    m.sort((a, b) => (a.type === "plant" ? 0 : 1) - (b.type === "plant" ? 0 : 1));
    const top = m.slice(0, 14);
    results.innerHTML = '<div class="lbl">' + (m.length ? m.length + ' matches' : 'nothing found') + '</div>' +
      top.map(n => '<div class="r" data-id="' + n.id + '"><i style="background:' + COLORS[n.type] + '"></i>' + n.label + '<span class="lt">' + (n.type === "plant" ? (n.latin || "plant") : LABELS[n.type]) + '</span></div>').join('');
    results.querySelectorAll(".r").forEach(r => r.onclick = () => pick(byId.get(r.dataset.id)));
  }
  function pick(node) { if (!node) return; results.classList.remove("on"); q.value = ""; q.blur(); onNodeClick(node); }
  q.addEventListener("focus", () => { q.value ? renderResults(q.value) : renderChips(); results.classList.add("on"); });
  q.addEventListener("input", () => { q.value ? renderResults(q.value) : renderChips(); results.classList.add("on"); });
  q.addEventListener("keydown", e => { if (e.key === "Enter") { const f = results.querySelector(".r,.chip"); if (f) f.click(); } else if (e.key === "Escape") { results.classList.remove("on"); q.blur(); } });
  document.addEventListener("click", e => { if (!document.getElementById("search").contains(e.target)) results.classList.remove("on"); });

  // ---- share + save ----
  document.getElementById("shareBtn").onclick = () => {
    const url = location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast(selected ? "link copied — re-opens to " + selected.label : "link copied"), () => toast(url));
    else toast(url);
  };
  function drawCover(cx, img, w, h) { const ir = img.width / img.height, r = w / h; let dw, dh, dx, dy; if (ir > r) { dh = h; dw = h * ir; dx = (w - dw) / 2; dy = 0; } else { dw = w; dh = w / ir; dx = 0; dy = (h - dh) / 2; } cx.drawImage(img, dx, dy, dw, dh); }
  document.getElementById("saveBtn").onclick = () => {
    try {
      const cv = document.querySelector("#graph canvas"); const w = cv.width, h = cv.height;
      const out = document.createElement("canvas"); out.width = w; out.height = h; const cx = out.getContext("2d");
      cx.fillStyle = "#0c0a07"; cx.fillRect(0, 0, w, h);
      if (window.__BGIMG__ && window.__BGIMG__.complete) { drawCover(cx, window.__BGIMG__, w, h); cx.fillStyle = "rgba(8,6,4,.63)"; cx.fillRect(0, 0, w, h); }
      cx.drawImage(cv, 0, 0, w, h);
      const a = document.createElement("a"); a.download = "pharmacopoeia" + (selected ? "-" + selected.label.replace(/\W+/g, "-").toLowerCase() : "") + ".png"; a.href = out.toDataURL("image/png"); a.click(); toast("image saved");
    } catch (e) { toast("save blocked (try it on the live site)"); }
  };

  window.PHARMA = { Graph, click: onNodeClick, reset, byId, data };

  // ===================== SOFT ACCESS METER (freemium) =====================
  // 1 herb free · +2 after an email · all 125 after purchase. A client-side
  // NUDGE (the data is already in the browser), not a hard wall. OFF by default —
  // flip METER.on to go live. Test/preview without editing:
  //   ?meter=1  anon flow   ?meter=email  as if signed in   ?meter=full  as if paid
  //   ?meter=reset  start over        ?meter=0  force off
  (function () {
    const METER = {
      on: false,                                        // ← flip to true to go live
      free: 1, email: 3,
      productUrl: "https://gumroad.com/l/REPLACE_ME",   // ← the "full pharmacopoeia" product
      price: "$7",                                      // ← display only
    };
    const ov = new URLSearchParams(location.search).get("meter");
    if (ov === "reset") ["wp_tier", "wp_viewed", "wp_email"].forEach(k => { try { localStorage.removeItem(k); } catch (_) {} });
    const ON = ["1", "email", "full", "reset"].includes(ov) ? true : ov === "0" ? false : METER.on;
    if (!ON) return;                                    // metering off → no gating at all

    const LS = {
      get: (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (_) { return d; } },
      set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
    };
    let tier = LS.get("wp_tier", "anon");               // anon | email | full
    if (ov === "email") tier = "email";
    if (ov === "full") tier = "full";
    const viewed = new Set(LS.get("wp_viewed", []));
    const saveViewed = () => LS.set("wp_viewed", [...viewed]);
    let pending = null, hinted = false;

    const gate = document.getElementById("gate"), gbody = gate.querySelector(".gbody");
    const limit = () => (tier === "email" ? METER.email : METER.free);
    const T = m => { try { toast(m); } catch (_) {} };

    function decide(node) {
      const key = node.id.slice(6);
      if (tier === "full" || viewed.has(key)) return "allow";
      if (viewed.size < limit()) {
        viewed.add(key); saveViewed();
        if (!hinted && tier === "anon") { hinted = true; T("a free taste — an email opens 2 more"); }
        return "allow";
      }
      return tier === "anon" ? "email" : "buy";
    }
    function guard(node) {                              // true = blocked (caller stops)
      const d = decide(node);
      if (d === "allow") return false;
      pending = node; open(d); return true;
    }
    const close = () => gate.classList.remove("on");
    function open(kind) { gbody.innerHTML = kind === "email" ? emailHTML() : buyHTML(); gate.classList.add("on"); wire(kind); }
    const err = m => { const e = gate.querySelector("#gerr"); if (e) e.textContent = m || ""; };

    const emailHTML = () => `
      <h2>&#127807; you've met your first herb</h2>
      <p>The pharmacopoeia holds all 125 — every effect, ailment and thread between them. Leave an email and two more open up, on the house.</p>
      <div class="err" id="gerr"></div>
      <input class="field" id="gemail" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email" />
      <button class="go" id="gsend">open 2 more &rarr;</button>
      <div class="tiny" id="gskip">just looking, thanks &rarr;</div>`;
    const buyHTML = () => `
      <h2>unlock the whole garden</h2>
      <p>You've wandered your three free herbs. The full pharmacopoeia — all 125 plants and the living web between them — is yours for ${METER.price}.</p>
      <a class="go" href="${METER.productUrl}" target="_blank" rel="noopener">get full access &middot; ${METER.price} &rarr;</a>
      <div class="div">already a member</div>
      <div class="err" id="gerr"></div>
      <input class="field" id="gkey" placeholder="paste your licence key" autocomplete="off" spellcheck="false" />
      <button class="go" id="gverify">unlock</button>
      <div class="tiny" id="gskip">keep browsing what I've seen &rarr;</div>`;

    function wire(kind) {
      gate.querySelector("#gskip").onclick = close;
      if (kind === "email") {
        const inp = gate.querySelector("#gemail"), btn = gate.querySelector("#gsend");
        setTimeout(() => inp.focus(), 40);
        const go = () => {
          const email = inp.value.trim();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err("that doesn't look like an email"); return; }
          // best-effort list capture — fire-and-forget, never blocks the unlock
          try {
            fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ "form-name": "wp-pharmacopoeia", email, source: "pharmacopoeia" }).toString(),
              signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined }).catch(() => {});
          } catch (_) {}
          LS.set("wp_email", email); tier = "email"; LS.set("wp_tier", tier);
          close(); if (pending) window.PHARMA.click(pending);
        };
        btn.onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
      } else {
        const inp = gate.querySelector("#gkey"), btn = gate.querySelector("#gverify");
        setTimeout(() => inp.focus(), 40);
        const go = async () => {
          const key = inp.value.trim(); if (!key) { err("paste your licence key first"); return; }
          btn.disabled = true; btn.textContent = "checking…"; err("");
          try {
            const r = await fetch("/api/verify-license", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ license_key: key }), signal: AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined });
            const j = await r.json().catch(() => ({}));
            if (j.valid) { tier = "full"; LS.set("wp_tier", tier); close(); T("unlocked — the whole garden's yours \u{1F33F}"); if (pending) window.PHARMA.click(pending); return; }
            err(j.error || j.reason || "that key didn't check out");
          } catch (_) { err("couldn't reach the licence service — try again"); }
          btn.disabled = false; btn.textContent = "unlock";
        };
        btn.onclick = go; inp.onkeydown = e => { if (e.key === "Enter") go(); };
      }
    }

    gate.querySelector(".gx").onclick = close;
    gate.addEventListener("click", e => { if (e.target === gate) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && gate.classList.contains("on")) close(); });
    window.__METER__ = { guard };
  })();
</script>
</body>
</html>
